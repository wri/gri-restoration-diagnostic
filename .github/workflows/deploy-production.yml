# =============================================================================
# Production Deployment Workflow
# Triggered on push to 'main' or 'production' branch
# =============================================================================

name: Deploy to Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: rd-app
  ENVIRONMENT: production

permissions:
  id-token: write
  contents: read

jobs:
  # ==========================================================================
  # Build and Test
  # ==========================================================================
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Build application
        run: npm run build

  # ==========================================================================
  # Build and Push Docker Image
  # ==========================================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.image_tag.outputs.value }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image tag
        id: image_tag
        run: echo "value=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check if image tag already exists
        id: image_exists
        run: |
          set +e
          DESCRIBE_OUTPUT=$(
            aws ecr describe-images \
              --repository-name "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}" \
              --image-ids imageTag="${{ steps.image_tag.outputs.value }}" \
              2>&1
          )
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image tag '${{ steps.image_tag.outputs.value }}' already exists in ECR. Skipping push."
            exit 0
          fi

          if echo "$DESCRIBE_OUTPUT" | grep -q "ImageNotFoundException"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image tag '${{ steps.image_tag.outputs.value }}' not found. Building and pushing."
            exit 0
          fi

          echo "$DESCRIBE_OUTPUT"
          exit 1

      - name: Build and push Docker image
        if: steps.image_exists.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}:${{ steps.image_tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_ENVIRONMENT=${{ env.ENVIRONMENT }}

      - name: Reuse existing image tag
        if: steps.image_exists.outputs.exists == 'true'
        run: echo "Reusing existing immutable image tag '${{ steps.image_tag.outputs.value }}'."

  # ==========================================================================
  # Deploy Infrastructure with Terraform
  # ==========================================================================
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.1

      - name: Terraform Init
        working-directory: terraform/infrastructure
        run: |
          terraform init \
            -backend-config="../environments/${{ env.ENVIRONMENT }}.backend.hcl"

      - name: Terraform Validate
        working-directory: terraform/infrastructure
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/infrastructure
        env:
          TF_VAR_secret_environment_variables: ${{ secrets.RD_APP_ENV }}
          TF_VAR_image_tag: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          terraform plan \
            -var-file="../environments/${{ env.ENVIRONMENT }}.tfvars" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/infrastructure
        run: terraform apply -auto-approve tfplan

  # ==========================================================================
  # Update ECS Service
  # ==========================================================================
  deploy-service:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-cluster \
            --service ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-service \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-cluster \
            --services ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-service

      - name: Get Application URL
        run: |
          echo "🚀 Application deployed successfully to PRODUCTION!"
          echo "📍 URL: https://www.restorationdiagnostic.org"
