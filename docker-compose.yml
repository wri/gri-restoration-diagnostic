version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: rd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-rduser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rdpassword}
      POSTGRES_DB: ${DB_NAME:-restoration_diagnostic}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rduser} -d ${DB_NAME:-restoration_diagnostic}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
